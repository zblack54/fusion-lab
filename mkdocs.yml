site_name: Fusion Lab
site_description: Reproducible sensor fusion experiments in Rust
repo_url: https://github.com/zblack54/fusion-lab
repo_name: zblack54/fusion-lab
docs_dir: docs
site_dir: site
theme:
  name: material
  palette:
    scheme: slate
    primary: deep orange
    accent: orange
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Learn:
      - Start here (15 minutes): learn/index.md
      - Math and code tour: learn/math-and-code.md
      - Reproduce and question results: learn/research.md
      - Iteration handoff template: learn/iteration-handoff.md
  - Roadmap: roadmap.md
  - Experiments:
      - Run an experiment: experiments.md
      - Outage protocol: experiments/outage-study-protocol.md
      - Outage results: experiments/outage-study.md
      - Capacity baseline: experiments/capacity-baseline.md
  - Design:
      - Numerical contract: design/v0.1.md
      - Service design and progress: https://github.com/zblack54/fusion-lab/issues/5
  - Development: development.md
  - Validation: validation.md
