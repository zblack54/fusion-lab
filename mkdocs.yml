site_name: Fusion Lab
site_description: Reproducible sensor fusion experiments in Rust
repo_url: https://github.com/zblack54/fusion-lab
repo_name: zblack54/fusion-lab
docs_dir: docs
site_dir: site
theme:
  name: material
  palette:
    scheme: slate
    primary: deep orange
    accent: orange
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Experiments: experiments.md
  - Design: design/v0.1.md
  - Development: development.md
  - Validation: validation.md
