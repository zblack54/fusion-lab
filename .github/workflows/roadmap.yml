name: Roadmap tracking
on:
  pull_request:
    paths:
      - .github/roadmap.json
      - .github/workflows/roadmap.yml
      - scripts/sync_roadmap.py
      - scripts/tests/test_sync_roadmap.py
  push:
    branches: [main]
    paths:
      - .github/roadmap.json
      - .github/workflows/roadmap.yml
      - scripts/sync_roadmap.py
      - scripts/tests/test_sync_roadmap.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_roadmap.py
      - run: python -m unittest discover -s scripts/tests -p test_sync_roadmap.py -v
  synchronize:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_roadmap.py --apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify idempotency
        run: python scripts/sync_roadmap.py --apply --assert-no-changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
