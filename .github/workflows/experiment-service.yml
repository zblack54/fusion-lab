name: Experiment service contract
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: ["1.99.0", stable]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTDOCFLAGS: -D warnings
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - run: rustc --version --verbose
      - run: cargo fmt --manifest-path crates/experiment-service/Cargo.toml -- --check
      - run: cargo check --manifest-path crates/experiment-service/Cargo.toml --locked --all-targets
      - run: cargo clippy --manifest-path crates/experiment-service/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/experiment-service/Cargo.toml --locked
      - run: cargo test --manifest-path crates/experiment-service/Cargo.toml --locked --doc
      - run: cargo doc --manifest-path crates/experiment-service/Cargo.toml --locked --no-deps
      - run: cargo clippy --manifest-path tests/experiment-service/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path tests/experiment-service/Cargo.toml --locked -- --test-threads=1

  resource-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal
      - name: Release workload, overload and failure demonstrations
        run: python crates/experiment-service/scripts/service_resource_probe.py --build --output service-linux-probe.json
      - name: Preserve actual measurements even after a failed demonstration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-service-linux-evidence
          path: service-linux-probe.json
          if-no-files-found: warn
