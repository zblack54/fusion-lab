# Implementation mode requires every immutable selector to pass before acceptance.
name: Observation delivery implementation
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: observation-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        toolchain: ["1.99.0", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_TERM_COLOR: never
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize approved checkout directories without rewriting files
        run: python docs/design-docs/observation-delivery/implementation/bootstrap_checkout.py --baseline-digest e0d3a23f4335193f6442fa7d1b244621b93bbf3f08ee9ba9c4b860c2eb15911b > native-checkout-bootstrap.json
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - run: python tests/observation-delivery/tools/native_baseline.py --toolchain ${{ matrix.toolchain }} --mode implementation --output native-delivery-evidence
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-delivery-${{ matrix.os }}-${{ matrix.toolchain }}
          path: native-delivery-evidence
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-delivery-bootstrap-baseline-${{ matrix.os }}-${{ matrix.toolchain }}
          path: native-checkout-bootstrap.json
          if-no-files-found: error
# Partial implementation remains draft: unfinished selectors do not permit acceptance.

  native-resources:
    needs: native-baseline
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        toolchain: ["1.99.0", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_TERM_COLOR: never
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      EXAMPLE_BINARY: ${{ matrix.os == 'windows-latest' && 'target/release/examples/observation_delivery.exe' || 'target/release/examples/observation_delivery' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize approved checkout directories without rewriting files
        run: python docs/design-docs/observation-delivery/implementation/bootstrap_checkout.py --baseline-digest e0d3a23f4335193f6442fa7d1b244621b93bbf3f08ee9ba9c4b860c2eb15911b > native-checkout-bootstrap.json
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: cargo fetch --locked
      - run: cargo build --locked --release --example observation_delivery
      - name: Qualify owned-child cleanup without numerical retries
        run: python docs/design-docs/observation-delivery/implementation/resource_cleanup_probe.py --output "${{ runner.temp }}/delivery-cleanup-${{ matrix.toolchain }}"
      - name: Example publication and native filesystem failure evidence
        run: python docs/design-docs/observation-delivery/implementation/example_probe.py --binary "${{ env.EXAMPLE_BINARY }}" --output native-example-evidence
      - name: Warmup and three fresh complete maximum-work measurements
        run: python docs/design-docs/observation-delivery/implementation/resource_probe.py --toolchain ${{ matrix.toolchain }} --output "${{ runner.temp }}/delivery-resource-${{ matrix.toolchain }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-delivery-resource-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/delivery-resource-${{ matrix.toolchain }}/*.json
            ${{ runner.temp }}/delivery-resource-${{ matrix.toolchain }}/project/Cargo.toml
            ${{ runner.temp }}/delivery-resource-${{ matrix.toolchain }}/project/Cargo.lock
            ${{ runner.temp }}/delivery-resource-${{ matrix.toolchain }}/project/src/main.rs
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-delivery-cleanup-${{ matrix.os }}-${{ matrix.toolchain }}
          path: ${{ runner.temp }}/delivery-cleanup-${{ matrix.toolchain }}/*.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-delivery-example-${{ matrix.os }}-${{ matrix.toolchain }}
          path: native-example-evidence
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-delivery-bootstrap-resources-${{ matrix.os }}-${{ matrix.toolchain }}
          path: native-checkout-bootstrap.json
          if-no-files-found: error
