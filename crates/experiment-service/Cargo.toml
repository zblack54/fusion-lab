[package]
name = "fusion-experiment-service"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
resolver = "3"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "fs", "io-util", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[lints.rust]
unsafe_code = "forbid"
