stage = "implementation"
owner = "Browser resource reviewer"
covers = ["REQ-010", "REQ-013", "REQ-014", "REQ-019", "CON-003", "CON-007"]
procedure = "Record hardware/browser/build. Load a real3600second approximately170MB artifact after one warmup, repeat three times; measure tab renderer plus dedicated-worker resident memory and application numeric allocation. Perform50 rapid selection/abort/reset cycles and30 control interactions while loading. Record long tasks, worker/SSE counts, parser yield intervals, canvas dimensions and queue sizes."
