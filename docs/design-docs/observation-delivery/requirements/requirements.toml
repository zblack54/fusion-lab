[[requirement]]
id = "REQ-001"
title = "Finite payload"
kind = "behavioral"
statement = "Observation construction SHALL reject every nonfinite payload component with its identity and axis."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-002"
title = "Scheduled identity"
kind = "behavioral"
statement = "Observation construction SHALL enforce per-sensor sequence equal to sample_tick divided by its exact 20-tick position or 5-tick velocity period."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-003"
title = "Causal timestamps"
kind = "behavioral"
statement = "Observation construction SHALL reject a planned arrival earlier than sampling."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-004"
title = "Bounded delay"
kind = "behavioral"
statement = "Observation and plan construction SHALL reject per-channel delays above 500 ticks with the appropriate observation or plan error."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-005"
title = "Requested model domain"
kind = "behavioral"
statement = "ReplayModel construction SHALL retain exactly finite requested sigmas and acceleration density in inclusive 0..100."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-006"
title = "Duration domain"
kind = "behavioral"
statement = "Trace construction SHALL accept only durations 1..3600 whole seconds and reject observations sampled after the final tick."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-007"
title = "Waiting capacity domain"
kind = "behavioral"
statement = "Trace and plan construction SHALL accept only pending capacities 1..128."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-008"
title = "Inventory cap"
kind = "behavioral"
statement = "Trace construction SHALL reject inventories above 90002 observations before contextual replay allocation."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-009"
title = "Unique identity"
kind = "behavioral"
statement = "Trace construction and decoding SHALL reject duplicate sensor/sequence identities across the entire inventory, including nonadjacent arrival records."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-010"
title = "Raw canonical normalization"
kind = "behavioral"
statement = "The raw Trace constructor SHALL normalize observation enumeration into planned-arrival/sample/position-before-velocity/sequence order."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-011"
title = "Strict imported order"
kind = "behavioral"
statement = "Trace decoding SHALL reject noncanonical recorded order without normalizing it."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-012"
title = "Observation-only projection"
kind = "behavioral"
statement = "Source projection SHALL copy only sampling ticks and present observation payloads into owned replay input without retaining a source borrow."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-001","ACC-005"]
status = "active"

[[requirement]]
id = "REQ-013"
title = "Source layout validation"
kind = "behavioral"
statement = "Source projection SHALL reject wrong sample count, unexpected ticks and off-schedule measurements before returning a Trace."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-014"
title = "Scheduled loss"
kind = "behavioral"
statement = "Replay SHALL decide scripted loss from the original scheduled sequence using (sequence+1) modulo N at sampling time before queue or horizon decisions."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-002"]
status = "active"

[[requirement]]
id = "REQ-015"
title = "Drain before admission"
kind = "behavioral"
statement = "Replay SHALL consume due arrivals before admitting newly sampled future observations at each tick."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-002"]
status = "active"

[[requirement]]
id = "REQ-016"
title = "Zero-delay bypass"
kind = "behavioral"
statement = "Replay SHALL route on-time observations without requiring a waiting-buffer slot."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-002"]
status = "active"

[[requirement]]
id = "REQ-017"
title = "Drop newest on full"
kind = "behavioral"
statement = "Replay SHALL preserve existing waiting entries and report the newly offered future observation as QueueFullDrop with occupancy equal to the validated capacity when full."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-002"]
status = "active"

[[requirement]]
id = "REQ-018"
title = "OnTimeOnly"
kind = "behavioral"
statement = "Replay SHALL apply only arrived observations sampled at the current tick and report arrived positive-delay observations as StaleDrop without numerical or baseline updates."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-002"]
status = "active"

[[requirement]]
id = "REQ-019"
title = "Finite horizon"
kind = "behavioral"
statement = "Replay SHALL stop snapshots at the configured final tick and finalize still-waiting observations as UndeliveredAtHorizon."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-002"]
status = "active"

[[requirement]]
id = "REQ-020"
title = "Fixed numerical version one"
kind = "behavioral"
statement = "Replay SHALL use the fixed zero state, covariance diagonal 25/25/4/4, requested-model variance floor 1e-12, synchronous 10ms prediction and canonical observation updates."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
source_ids = ["ACC-001"]
status = "active"

[[requirement]]
id = "REQ-021"
title = "Policy-aligned baselines"
kind = "behavioral"
statement = "Replay SHALL supply only accepted observations to hold and preceding-tick velocity integration with position resets."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
