status = "active"

[[requirement]]
id = "REQ-022"
title = "Source ledger accounting"
kind = "behavioral"
statement = "Replay SHALL return one source-ordered terminal ledger entry per offered identity with the exact decision tick, planned time and outcome-specific queue occupancy."
rationale = "Constrain the observable boundary before implementation; exact domain, examples and errors are specified in the API/format document."
