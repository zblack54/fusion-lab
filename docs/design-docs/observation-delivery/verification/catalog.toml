[[verification]]
id = "VER-001"
method = "inspection"
stage = "both"
owner = "independent delivery API reviewer"
covers = ["REQ-012","REQ-030","REQ-032","CON-001"]
procedure = "Review the private validated type/accessor surface, source projection field reads and borrow ending, and the absence of source Config/truth/seed references or alternate unchecked construction paths. Inspect actual implementation after approval; combine poisoned-source and external record-update compile-negative results."
acceptance = "Only source tick and present measurements influence projection; replay has observational/model authority only; every validated data field is private and no public mutable alias or unchecked constructor bypasses validation."
design_evidence = "verification/authority-boundary.md"
reviewed_by = "Main orchestrator and independent bias_review; technical revision2 approved issue72comment6527647445 after exact-head0e52c397 evidence; implementation inspection remains required"

[[verification]]
id = "VER-002"
method = "proof"
stage = "both"
owner = "independent resource and format reviewer"
covers = ["REQ-015","REQ-017","REQ-024","REQ-025","REQ-027","REQ-028","REQ-037","CON-003","CON-004"]
procedure = "Review the scheduled-identity cardinality and waiting/arrival burst argument, finite Display token/line proof and actual Rust extreme probe, then inspect constructor/codec append limits and replay indexing for O(H+NlogN) or better work. Inspect no full N rescan per H tick and no oversized complete output before enforcing its cap."
