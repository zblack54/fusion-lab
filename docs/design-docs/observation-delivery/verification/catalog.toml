reviewed_by = "Main orchestrator and independent bias_review; technical revision2 approved issue72comment6527647445 after exact-head0e52c397 evidence; implementation inspection remains required"

[[verification]]
id = "VER-003"
method = "inspection"
stage = "implementation"
owner = "independent exact-source conformance reviewer"
covers = ["REQ-029","REQ-030","REQ-032","REQ-036","CON-005","CON-006"]
procedure = "Inspect exact production diff and Cargo manifest/lock closure, error propagation and source chaining, private state commit, no new production runtime/crate/dependencies or unsafe Rust, absence of diagnostic marker, no I/O in library and unchanged legacy numerical/CSV/service/dashboard paths. Run all required legacy and contract gates at exact head."
acceptance = "No sentinel behavior, alternate truth source, silent numerical drop, successful partial result, filesystem side effect or adapter migration remains; every typed error and original core Error source is preserved; legacy gates and exact-source reviews are clear."

[[verification]]
id = "VER-004"
method = "demonstration"
stage = "implementation"
owner = "independent native resource measurement reviewer"
covers = ["REQ-033","REQ-034","CON-007"]
procedure = "On native Windows and Linux for Rust1.99/stable release builds, perform one small warmup then three fresh owned process runs of the exact workload in verification/resource-workload.md. Preserve source/config/lock/toolchain/CPU/RAM/OS, independently reviewed nonproduction sampler SHA256, elapsed spawn-to-complete-work, lifetime HWM and every equality result. Use a60second external owned timeout and reap failures; no wall-clock logic enters library."
acceptance = "Every measured complete-work process takes<=30seconds and lifetime peakRSS<=512MiB with successful source+trace+result+codec retention and roundtrip bit equality. HWM versus sampled telemetry and runtime-measured versus OS-enforced limits are labeled; any failure requires reviewed repair/revision, not a relaxed budget or omitted run."

[[verification]]
id = "VER-005"
method = "demonstration"
stage = "implementation"
owner = "independent human handoff reviewer"
covers = ["REQ-035","REQ-036","CON-008"]
procedure = "Run the separate one-second reproduction example in a new owned output directory, reject a preexisting directory unchanged, verify capped complete TSV artifacts and scoped temporary file publication, report actual failures, and read the learning/issue/PR handoff against parent6 acceptance."
acceptance = "Example succeeds only after both complete artifacts are written/flushed/published; write errors disclose possible complete earlier artifacts or owned temporaries. No deployment/wire change or actual async/slow-consumer/shutdown/full6 acceptance claim appears."

