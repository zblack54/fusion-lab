[[verification]]
id = "VER-009"
method = "demonstration"
stage = "implementation"
owner = "independent scope and native sandbox reviewer"
covers = ["REQ-037", "REQ-038", "REQ-039", "REQ-040", "REQ-041", "REQ-042", "REQ-043", "CON-008", "CON-009", "REQ-044", "CON-010"]
procedure = "Inspect every native dispatch and bridge intake path against the exact approved scope bytes and universal gate; compare the received approved_scope raw UTF8 SHA256 with the independent file digest and observed expected_head with initial Git HEAD; execute missing/altered/schema/identity/size/control tests. Demonstrate unchanged initial/post Git HEAD for read-only positives and deliberate peer commit mutation rejection with matching current-head output, durable EvidenceMismatch pause, no accepted implementation or host intent, no Enable/Tick bypass, preserved before/after evidence and explicit owner-inspection/cancel/new-scope recovery. On native Windows verify pinned CLI accepts writable_roots=[], exclude_tmpdir_env_var=true and exclude_slash_tmp=true, then attempt real writes to sibling host state, ACK bridge and scope control from workspace-write and read-only workers. Demonstrate file growth, symlink/reparse rejection (record privilege blockers), wrong checkout aliases, no approval/attempt mutation on rejection, and an approved read-only subscription smoke with exact instructions. Review SHA2 closure and native1.99/stable compilation; preserve all old assertions. No paid API or actual inference before the gate."
acceptance = "Prelaunch negatives remain fail closed without worker launch or host ACK/state forgery; deliberate read-only peer mutation is a one-launch postlaunch negative that preserves the change and blocks acceptance/relaunch; actual Windows write-denial evidence supports isolation, not documentation or fake-peer argv alone. Bounded scope/prompt and exact raw-byte digest match independently reviewed host approval. Missing privilege/capability evidence remains an acceptance gap."
