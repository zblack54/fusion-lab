[[requirement]]
id = "REQ-001"
title = "Continuous dependency dispatch"
kind = "behavioral"
statement = "The supervisor SHALL select the lowest ready task ID whose dependencies are done when an enabled cycle has no active attempt."
rationale = "Makes issue #4 lifecycle behavior observable and prevents duplicate or unauthorized work."
source_ids = ["ACC-001"]
status = "active"

[[requirement]]
id = "REQ-002"
title = "Restart reconciliation"
kind = "behavioral"
statement = "After a confirmed dead worker, restart reconciliation SHALL preserve its checkpoint and requeue its unfinished task with its previous attempt count."
rationale = "Makes issue #4 lifecycle behavior observable and prevents duplicate or unauthorized work."
source_ids = ["ACC-002"]
status = "active"

[[requirement]]
id = "REQ-003"
title = "Exhaustion stops dispatch"
kind = "behavioral"
statement = "The supervisor SHALL persist a quota pause and next eligible account reset when a required usage window is exhausted."
rationale = "Makes issue #4 lifecycle behavior observable and prevents duplicate or unauthorized work."
source_ids = ["ACC-003"]
status = "active"

[[requirement]]
id = "REQ-004"
title = "Merged evidence completes work"
kind = "behavioral"
statement = "The supervisor SHALL mark a verified task done only after matching successful merge evidence for its current head."
rationale = "Makes issue #4 lifecycle behavior observable and prevents duplicate or unauthorized work."
source_ids = ["ACC-004"]
status = "active"

[[requirement]]
id = "REQ-005"
title = "Probe triage"
