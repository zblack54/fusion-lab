[package]
name = "fusion-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Reproducible 2D sensor fusion experiments in Rust"
license = "MIT"
repository = "https://github.com/zblack54/fusion-lab"
publish = false
resolver = "3"

[dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10"
rand_distr = "0.6"
clap = { version = "4.5", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

